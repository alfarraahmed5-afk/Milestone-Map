<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Water hatching pattern -->
    <pattern id="water-hatch" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <line x1="0" y1="6" x2="12" y2="6" stroke="#6B9BB8" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <!-- Land stipple -->
    <pattern id="land-stipple" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.8" fill="#8B6F47" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- ── Sea / Water body (Øresund + harbour) ─────────────────────────── -->
  <!-- Left water mass -->
  <path d="M 0 0 L 320 0 L 310 80 L 280 180 L 260 320 L 240 460 L 200 560
           L 180 700 L 160 800 L 120 900 L 80 1000 L 0 1080 Z"
        fill="#6B9BB8" opacity="0.55"/>
  <path d="M 0 0 L 320 0 L 310 80 L 280 180 L 260 320 L 240 460 L 200 560
           L 180 700 L 160 800 L 120 900 L 80 1000 L 0 1080 Z"
        fill="url(#water-hatch)"/>

  <!-- Right water mass (Baltic side) -->
  <path d="M 1080 0 L 780 0 L 790 120 L 820 260 L 840 400 L 860 540
           L 880 680 L 900 820 L 940 940 L 1080 1080 Z"
        fill="#6B9BB8" opacity="0.45"/>
  <path d="M 1080 0 L 780 0 L 790 120 L 820 260 L 840 400 L 860 540
           L 880 680 L 900 820 L 940 940 L 1080 1080 Z"
        fill="url(#water-hatch)"/>

  <!-- Harbour basin -->
  <ellipse cx="540" cy="820" rx="160" ry="80" fill="#6B9BB8" opacity="0.5"/>
  <ellipse cx="540" cy="820" rx="160" ry="80" fill="url(#water-hatch)"/>

  <!-- ── Island landmass (Sjælland simplified) ─────────────────────────── -->
  <path d="M 330 0 L 770 0 L 790 120 L 810 260 L 820 400 L 820 560
           L 800 700 L 780 820 L 720 900 L 660 940 L 600 960 L 540 980
           L 480 960 L 420 940 L 360 900 L 300 820 L 270 700 L 260 540
           L 270 400 L 280 260 L 300 120 Z"
        fill="#E8D8AA" opacity="0.85"/>
  <path d="M 330 0 L 770 0 L 790 120 L 810 260 L 820 400 L 820 560
           L 800 700 L 780 820 L 720 900 L 660 940 L 600 960 L 540 980
           L 480 960 L 420 940 L 360 900 L 300 820 L 270 700 L 260 540
           L 270 400 L 280 260 L 300 120 Z"
        fill="url(#land-stipple)"/>

  <!-- Island outline (coastline hatching) -->
  <path d="M 330 0 L 770 0 L 790 120 L 810 260 L 820 400 L 820 560
           L 800 700 L 780 820 L 720 900 L 660 940 L 600 960 L 540 980
           L 480 960 L 420 940 L 360 900 L 300 820 L 270 700 L 260 540
           L 270 400 L 280 260 L 300 120 Z"
        fill="none" stroke="#8B6F47" stroke-width="2.5"/>

  <!-- ── Nyhavn Harbour Buildings ──────────────────────────────────────── -->
  <!-- Row of coloured facades (simplified period row-houses) -->
  <g id="nyhavn-row" transform="translate(360, 680)">
    <!-- House 1 – terracotta -->
    <rect x="0"   y="0" width="42" height="90" fill="#C4714F"/>
    <rect x="4"   y="4" width="34" height="50" fill="#E8A07A" opacity="0.4"/>
    <rect x="12"  y="18" width="10" height="14" fill="#3D2B1F" opacity="0.6"/>
    <rect x="26"  y="18" width="10" height="14" fill="#3D2B1F" opacity="0.6"/>
    <polygon points="0,0 21,-28 42,0" fill="#8B4F2E"/>
    <!-- House 2 – sage -->
    <rect x="44"  y="8" width="38" height="82" fill="#7A9E7E"/>
    <rect x="48"  y="12" width="30" height="45" fill="#A0BEA2" opacity="0.4"/>
    <rect x="54"  y="24" width="9"  height="13" fill="#3D2B1F" opacity="0.6"/>
    <rect x="67"  y="24" width="9"  height="13" fill="#3D2B1F" opacity="0.6"/>
    <polygon points="44,8 63,-18 82,8" fill="#5A7A5E"/>
    <!-- House 3 – sepia/cream -->
    <rect x="84"  y="0" width="44" height="90" fill="#D4B88A"/>
    <rect x="88"  y="4" width="36" height="52" fill="#EDD9A8" opacity="0.4"/>
    <rect x="96"  y="20" width="10" height="14" fill="#3D2B1F" opacity="0.6"/>
    <rect x="112" y="20" width="10" height="14" fill="#3D2B1F" opacity="0.6"/>
    <polygon points="84,0 106,-30 128,0" fill="#A89058"/>
    <!-- House 4 – pale blue -->
    <rect x="130" y="10" width="36" height="80" fill="#8BAFC4"/>
    <rect x="134" y="14" width="28" height="44" fill="#B0CDD8" opacity="0.4"/>
    <rect x="140" y="26" width="8" height="12" fill="#3D2B1F" opacity="0.6"/>
    <rect x="154" y="26" width="8" height="12" fill="#3D2B1F" opacity="0.6"/>
    <polygon points="130,10 148,-16 166,10" fill="#6A8F9E"/>
    <!-- House 5 – warm red -->
    <rect x="168" y="0" width="40" height="90" fill="#B85A3A"/>
    <rect x="172" y="4" width="32" height="50" fill="#D47E60" opacity="0.4"/>
    <rect x="180" y="18" width="9" height="13" fill="#3D2B1F" opacity="0.6"/>
    <rect x="195" y="18" width="9" height="13" fill="#3D2B1F" opacity="0.6"/>
    <polygon points="168,0 188,-25 208,0" fill="#8B3A22"/>
    <!-- Quayside base line -->
    <rect x="-4" y="90" width="216" height="6" fill="#8B6F47"/>
  </g>

  <!-- ── The Little Mermaid Silhouette ─────────────────────────────────── -->
  <g id="little-mermaid" transform="translate(238, 730)">
    <!-- Rock -->
    <ellipse cx="30" cy="62" rx="32" ry="14" fill="#A89880"/>
    <path d="M 8 58 Q 18 42 30 38 Q 42 42 52 58 Q 50 68 30 72 Q 10 68 8 58 Z"
          fill="#8B7A60"/>
    <!-- Body -->
    <path d="M 30 38 Q 24 28 26 18 Q 28 10 30 8 Q 32 10 34 18 Q 36 28 30 38 Z"
          fill="#3D2B1F"/>
    <!-- Tail / fin -->
    <path d="M 26 44 Q 14 56 10 62 Q 20 58 24 62 Q 22 68 12 74 Q 30 65 38 70
             Q 34 62 40 58 Q 46 54 34 44 Z"
          fill="#3D2B1F"/>
    <!-- Head / hair -->
    <circle cx="30" cy="8" r="7" fill="#3D2B1F"/>
    <path d="M 24 6 Q 20 14 22 20 Q 24 16 26 18" fill="#3D2B1F"/>
    <!-- Arm reaching up -->
    <path d="M 30 20 Q 20 12 18 6" fill="none" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>
    <!-- Woodcut hatch on figure -->
    <path d="M 26 18 L 22 30 M 28 16 L 24 28 M 30 15 L 28 26"
          stroke="#F5E6C8" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- ── Sailing Vessels ───────────────────────────────────────────────── -->
  <!-- Vessel 1 -->
  <g id="vessel-1" transform="translate(160, 560)">
    <path d="M 0 30 Q 30 26 60 30 Q 55 38 5 38 Z" fill="#3D2B1F"/>
    <line x1="30" y1="30" x2="30" y2="-10" stroke="#3D2B1F" stroke-width="2"/>
    <path d="M 30 -10 L 30 28 L 60 28 Z" fill="#F5E6C8" opacity="0.8"/>
    <path d="M 30 -8  L 30 26 L 8  26 Z" fill="#F5E6C8" opacity="0.6"/>
  </g>
  <!-- Vessel 2 (smaller) -->
  <g id="vessel-2" transform="translate(820, 480) scale(0.7)">
    <path d="M 0 30 Q 30 26 60 30 Q 55 38 5 38 Z" fill="#3D2B1F"/>
    <line x1="30" y1="30" x2="30" y2="-10" stroke="#3D2B1F" stroke-width="2"/>
    <path d="M 30 -10 L 30 28 L 60 28 Z" fill="#F5E6C8" opacity="0.7"/>
  </g>
  <!-- Vessel 3 (tiny, background) -->
  <g id="vessel-3" transform="translate(880, 180) scale(0.45)">
    <path d="M 0 30 Q 30 26 60 30 Q 55 38 5 38 Z" fill="#3D2B1F" opacity="0.6"/>
    <line x1="30" y1="30" x2="30" y2="-10" stroke="#3D2B1F" stroke-width="2" opacity="0.6"/>
    <path d="M 30 -10 L 30 28 L 60 28 Z" fill="#F5E6C8" opacity="0.5"/>
  </g>

  <!-- ── Water Hatching Strokes (foreground detail) ────────────────────── -->
  <g stroke="#6B9BB8" stroke-width="1" opacity="0.5">
    <line x1="60"  y1="300" x2="200" y2="310"/>
    <line x1="40"  y1="330" x2="190" y2="340"/>
    <line x1="70"  y1="360" x2="220" y2="368"/>
    <line x1="50"  y1="500" x2="220" y2="508"/>
    <line x1="30"  y1="530" x2="200" y2="536"/>
    <line x1="840" y1="280" x2="1000" y2="286"/>
    <line x1="860" y1="310" x2="1020" y2="316"/>
    <line x1="850" y1="460" x2="1040" y2="468"/>
  </g>

  <!-- ── Coastal Edge Hatching ──────────────────────────────────────────── -->
  <g stroke="#8B6F47" stroke-width="0.8" opacity="0.35">
    <line x1="315" y1="50"  x2="295" y2="60"/>
    <line x1="315" y1="70"  x2="292" y2="82"/>
    <line x1="316" y1="90"  x2="290" y2="104"/>
    <line x1="266" y1="350" x2="244" y2="362"/>
    <line x1="264" y1="370" x2="242" y2="384"/>
    <line x1="778" y1="50"  x2="800" y2="60"/>
    <line x1="780" y1="70"  x2="802" y2="83"/>
    <line x1="782" y1="90"  x2="806" y2="105"/>
  </g>

  <!-- ── City Label ─────────────────────────────────────────────────────── -->
  <text x="540" y="630" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="28" font-variant="small-caps" letter-spacing="5"
        fill="#3D2B1F" opacity="0.75">Copenhagen</text>
  <line x1="440" y1="638" x2="640" y2="638" stroke="#8B6F47" stroke-width="1" opacity="0.6"/>
</svg>

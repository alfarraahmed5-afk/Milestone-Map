<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Farmland furrow pattern -->
    <pattern id="furrows" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(2)">
      <line x1="0" y1="12" x2="24" y2="12" stroke="#7A9E7E" stroke-width="1" opacity="0.45"/>
    </pattern>
    <!-- Field stipple -->
    <pattern id="field-stipple" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.9" fill="#6A8854" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- ── Sky / Upper Gradient ──────────────────────────────────────────── -->
  <rect x="0" y="0" width="1080" height="320" fill="#EDE0C4" opacity="0.6"/>

  <!-- ── Flat Farmland Base ─────────────────────────────────────────────── -->
  <!-- Background land (horizon level ~300) -->
  <rect x="0" y="300" width="1080" height="780" fill="#C8D9A8" opacity="0.7"/>
  <rect x="0" y="300" width="1080" height="780" fill="url(#furrows)"/>

  <!-- Field band 1 (middle green) -->
  <rect x="0" y="380" width="1080" height="180" fill="#7A9E7E" opacity="0.5"/>
  <rect x="0" y="380" width="1080" height="180" fill="url(#furrows)"/>

  <!-- Field band 2 (lighter) -->
  <rect x="0" y="560" width="1080" height="160" fill="#A8C490" opacity="0.45"/>
  <rect x="0" y="560" width="1080" height="160" fill="url(#field-stipple)"/>

  <!-- Hedgerow lines (horizontal dark strips) -->
  <rect x="0"   y="375" width="1080" height="6"  fill="#5A7A4A" opacity="0.55"/>
  <rect x="0"   y="555" width="1080" height="5"  fill="#5A7A4A" opacity="0.45"/>
  <rect x="0"   y="720" width="1080" height="4"  fill="#5A7A4A" opacity="0.35"/>

  <!-- ── Horizon Line ───────────────────────────────────────────────────── -->
  <line x1="0" y1="302" x2="1080" y2="302"
        stroke="#3D2B1F" stroke-width="1.5" opacity="0.4"/>

  <!-- ── Half-Timbered Houses ───────────────────────────────────────────── -->
  <g id="house-row" transform="translate(290, 220)">
    <!-- House 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="30" width="90" height="80" fill="#FAF3E6"/>
      <rect x="0" y="30" width="90" height="80" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
      <!-- timber frame -->
      <line x1="45" y1="30" x2="45" y2="110" stroke="#3D2B1F" stroke-width="2.5"/>
      <line x1="0"  y1="70" x2="90" y2="70"  stroke="#3D2B1F" stroke-width="2"/>
      <line x1="0"  y1="50" x2="45" y2="30"  stroke="#3D2B1F" stroke-width="1.5"/>
      <line x1="90" y1="50" x2="45" y2="30"  stroke="#3D2B1F" stroke-width="1.5"/>
      <!-- windows -->
      <rect x="10" y="40" width="18" height="18" fill="#6B9BB8" opacity="0.55" stroke="#3D2B1F" stroke-width="1"/>
      <rect x="62" y="40" width="18" height="18" fill="#6B9BB8" opacity="0.55" stroke="#3D2B1F" stroke-width="1"/>
      <rect x="32" y="78" width="26" height="32" fill="#8B6F47" opacity="0.4" stroke="#3D2B1F" stroke-width="1"/><!-- door -->
      <!-- Roof -->
      <polygon points="−6,30 45,−14 96,30" fill="#C4714F"/>
      <polygon points="−6,30 45,−14 96,30" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    </g>
    <!-- House 2 (taller) -->
    <g transform="translate(102,0)">
      <rect x="0" y="18" width="80" height="92" fill="#E8D8AA"/>
      <rect x="0" y="18" width="80" height="92" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
      <line x1="40" y1="18" x2="40" y2="110" stroke="#3D2B1F" stroke-width="2.5"/>
      <line x1="0"  y1="62" x2="80" y2="62"  stroke="#3D2B1F" stroke-width="2"/>
      <line x1="14" y1="40" x2="66" y2="40"  stroke="#3D2B1F" stroke-width="1.5"/>
      <rect x="10" y="28" width="14" height="18" fill="#6B9BB8" opacity="0.55" stroke="#3D2B1F" stroke-width="1"/>
      <rect x="56" y="28" width="14" height="18" fill="#6B9BB8" opacity="0.55" stroke="#3D2B1F" stroke-width="1"/>
      <rect x="28" y="72" width="24" height="38" fill="#8B6F47" opacity="0.4" stroke="#3D2B1F" stroke-width="1"/>
      <polygon points="−4,18 40,−20 84,18" fill="#7A9E7E"/>
      <polygon points="−4,18 40,−20 84,18" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    </g>
    <!-- House 3 -->
    <g transform="translate(194,10)">
      <rect x="0" y="28" width="88" height="82" fill="#FAF3E6"/>
      <rect x="0" y="28" width="88" height="82" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
      <line x1="44" y1="28" x2="44" y2="110" stroke="#3D2B1F" stroke-width="2.5"/>
      <line x1="0"  y1="65" x2="88" y2="65"  stroke="#3D2B1F" stroke-width="2"/>
      <line x1="0"  y1="46" x2="44" y2="28"  stroke="#3D2B1F" stroke-width="1.5"/>
      <line x1="88" y1="46" x2="44" y2="28"  stroke="#3D2B1F" stroke-width="1.5"/>
      <rect x="10" y="37" width="15" height="16" fill="#6B9BB8" opacity="0.55" stroke="#3D2B1F" stroke-width="1"/>
      <rect x="63" y="37" width="15" height="16" fill="#6B9BB8" opacity="0.55" stroke="#3D2B1F" stroke-width="1"/>
      <rect x="30" y="73" width="28" height="37" fill="#8B6F47" opacity="0.4" stroke="#3D2B1F" stroke-width="1"/>
      <polygon points="−4,28 44,−10 92,28" fill="#C4714F"/>
      <polygon points="−4,28 44,−10 92,28" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    </g>
    <!-- Ground baseline -->
    <rect x="-4" y="110" width="290" height="5" fill="#8B6F47" opacity="0.5"/>
  </g>

  <!-- ── Windmill ───────────────────────────────────────────────────────── -->
  <g id="windmill" transform="translate(760, 140)">
    <!-- Tower -->
    <polygon points="30,8 0,180 60,180" fill="#D4B88A"/>
    <polygon points="30,8 0,180 60,180" fill="none" stroke="#3D2B1F" stroke-width="2"/>
    <!-- Tower door -->
    <path d="M 22 164 Q 22 150 30 150 Q 38 150 38 164 L 38 180 L 22 180 Z" fill="#8B6F47" opacity="0.6"/>
    <!-- Cap -->
    <path d="M 12 40 Q 30 24 48 40 Q 48 54 30 56 Q 12 54 12 40 Z" fill="#A89880"/>
    <path d="M 12 40 Q 30 24 48 40 Q 48 54 30 56 Q 12 54 12 40 Z" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    <!-- Blades (4) -->
    <g transform="translate(30,47) rotate(25)">
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#3D2B1F" stroke-width="2.5"/>
      <path d="M 0,0 L -14,-66 L 0,-68 L 14,-66 Z" fill="#FAF3E6" stroke="#3D2B1F" stroke-width="1" opacity="0.85"/>
    </g>
    <g transform="translate(30,47) rotate(115)">
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#3D2B1F" stroke-width="2.5"/>
      <path d="M 0,0 L -14,-66 L 0,-68 L 14,-66 Z" fill="#FAF3E6" stroke="#3D2B1F" stroke-width="1" opacity="0.85"/>
    </g>
    <g transform="translate(30,47) rotate(205)">
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#3D2B1F" stroke-width="2.5"/>
      <path d="M 0,0 L -14,-66 L 0,-68 L 14,-66 Z" fill="#FAF3E6" stroke="#3D2B1F" stroke-width="1" opacity="0.85"/>
    </g>
    <g transform="translate(30,47) rotate(295)">
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#3D2B1F" stroke-width="2.5"/>
      <path d="M 0,0 L -14,-66 L 0,-68 L 14,-66 Z" fill="#FAF3E6" stroke="#3D2B1F" stroke-width="1" opacity="0.85"/>
    </g>
    <!-- Hub -->
    <circle cx="30" cy="47" r="5" fill="#8B6F47" stroke="#3D2B1F" stroke-width="1.5"/>
    <!-- Ground -->
    <rect x="-4" y="180" width="68" height="5" fill="#8B6F47" opacity="0.4"/>
  </g>

  <!-- ── H.C. Andersen Paper Swans ──────────────────────────────────────── -->
  <g id="paper-swans">
    <!-- Swan 1 -->
    <g transform="translate(130, 440)">
      <path d="M 0 20 Q 10 0 24 4 Q 30 6 28 14 Q 20 10 14 18 Q 22 14 26 22
               Q 22 30 8 30 Q -2 28 0 20 Z" fill="#FAF3E6" stroke="#8B6F47" stroke-width="1"/>
      <!-- Neck -->
      <path d="M 24 4 Q 32 -6 36 -2 Q 34 4 28 6" fill="#FAF3E6" stroke="#8B6F47" stroke-width="1"/>
      <!-- Head -->
      <circle cx="36" cy="-4" r="5" fill="#FAF3E6" stroke="#8B6F47" stroke-width="1"/>
      <!-- Beak -->
      <path d="M 40 -5 L 46 -4 L 40 -2" fill="#C4714F"/>
    </g>
    <!-- Swan 2 (smaller, right side) -->
    <g transform="translate(900, 500) scale(0.7)">
      <path d="M 0 20 Q 10 0 24 4 Q 30 6 28 14 Q 20 10 14 18 Q 22 14 26 22
               Q 22 30 8 30 Q -2 28 0 20 Z" fill="#FAF3E6" stroke="#8B6F47" stroke-width="1"/>
      <path d="M 24 4 Q 32 -6 36 -2 Q 34 4 28 6" fill="#FAF3E6" stroke="#8B6F47" stroke-width="1"/>
      <circle cx="36" cy="-4" r="5" fill="#FAF3E6" stroke="#8B6F47" stroke-width="1"/>
      <path d="M 40 -5 L 46 -4 L 40 -2" fill="#C4714F"/>
    </g>
  </g>

  <!-- ── Sparse Trees on Horizon ────────────────────────────────────────── -->
  <g id="trees" stroke="#3D2B1F" stroke-width="1.5" fill="#3D2B1F" opacity="0.65">
    <!-- Tree cluster left -->
    <line x1="80"  y1="302" x2="80"  y2="256"/>
    <path d="M 66 265 Q 80 240 94 265 Q 80 258 66 265 Z"/>
    <path d="M 70 280 Q 80 260 90 280 Q 80 274 70 280 Z"/>
    <line x1="140" y1="302" x2="140" y2="258"/>
    <path d="M 126 268 Q 140 244 154 268 Q 140 262 126 268 Z"/>
    <path d="M 130 282 Q 140 262 150 282 Q 140 276 130 282 Z"/>
    <!-- Tree cluster right -->
    <line x1="960" y1="302" x2="960" y2="250"/>
    <path d="M 946 262 Q 960 236 974 262 Q 960 255 946 262 Z"/>
    <path d="M 950 278 Q 960 256 970 278 Q 960 272 950 278 Z"/>
    <line x1="1010" y1="302" x2="1010" y2="260"/>
    <path d="M 996 272 Q 1010 248 1024 272 Q 1010 265 996 272 Z"/>
  </g>

  <!-- ── City Label ─────────────────────────────────────────────────────── -->
  <text x="540" y="850" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="26" font-variant="small-caps" letter-spacing="5"
        fill="#3D2B1F" opacity="0.7">Odense</text>
  <line x1="460" y1="858" x2="620" y2="858" stroke="#8B6F47" stroke-width="1" opacity="0.55"/>
</svg>

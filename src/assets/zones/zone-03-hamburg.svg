<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- River flow hatch -->
    <pattern id="river-hatch" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <line x1="0" y1="8" x2="16" y2="8" stroke="#6B9BB8" stroke-width="0.9" opacity="0.55"/>
    </pattern>
    <!-- Brick pattern -->
    <pattern id="brickwork" x="0" y="0" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="none"/>
      <rect x="1" y="1" width="18" height="4" fill="#A84830" opacity="0.25"/>
      <rect x="-9" y="7" width="18" height="4" fill="#A84830" opacity="0.25"/>
      <rect x="11" y="7" width="18" height="4" fill="#A84830" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- ── Sky ────────────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1080" height="340" fill="#E4D8BE" opacity="0.7"/>
  <!-- Overcast cloud suggestion -->
  <ellipse cx="200" cy="80"  rx="180" ry="40" fill="#F5E6C8" opacity="0.4"/>
  <ellipse cx="700" cy="120" rx="220" ry="50" fill="#F5E6C8" opacity="0.35"/>
  <ellipse cx="500" cy="60"  rx="150" ry="35" fill="#F5E6C8" opacity="0.3"/>

  <!-- ── Elbe River ─────────────────────────────────────────────────────── -->
  <!-- Wide waterway spanning most of the canvas width -->
  <path d="M -20 480 Q 100 460 300 470 Q 500 480 700 465 Q 880 452 1100 470
           L 1100 640 Q 900 625 700 638 Q 500 650 300 636 Q 120 624 -20 640 Z"
        fill="#6B9BB8" opacity="0.6"/>
  <path d="M -20 480 Q 100 460 300 470 Q 500 480 700 465 Q 880 452 1100 470
           L 1100 640 Q 900 625 700 638 Q 500 650 300 636 Q 120 624 -20 640 Z"
        fill="url(#river-hatch)"/>

  <!-- River bank edges -->
  <path d="M -20 480 Q 100 460 300 470 Q 500 480 700 465 Q 880 452 1100 470"
        fill="none" stroke="#3D2B1F" stroke-width="2" opacity="0.5"/>
  <path d="M -20 640 Q 120 624 300 636 Q 500 650 700 638 Q 900 625 1100 640"
        fill="none" stroke="#3D2B1F" stroke-width="2" opacity="0.5"/>

  <!-- River flow strokes -->
  <g stroke="#6B9BB8" stroke-width="1.2" opacity="0.45">
    <line x1="60"  y1="510" x2="240" y2="516"/>
    <line x1="80"  y1="530" x2="260" y2="535"/>
    <line x1="340" y1="495" x2="520" y2="500"/>
    <line x1="360" y1="515" x2="550" y2="520"/>
    <line x1="620" y1="488" x2="820" y2="492"/>
    <line x1="640" y1="508" x2="840" y2="512"/>
    <line x1="880" y1="480" x2="1060" y2="485"/>
    <line x1="100" y1="610" x2="300" y2="616"/>
    <line x1="500" y1="632" x2="700" y2="627"/>
  </g>

  <!-- ── Speicherstadt Warehouses (left bank) ───────────────────────────── -->
  <g id="speicherstadt" transform="translate(60, 300)">
    <!-- Warehouse 1 -->
    <rect x="0"   y="0" width="90" height="180" fill="#8B3A22"/>
    <rect x="0"   y="0" width="90" height="180" fill="url(#brickwork)"/>
    <rect x="0"   y="0" width="90" height="180" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    <!-- Arched windows row 1 -->
    <path d="M 10 20 Q 10 8 20 8 Q 30 8 30 20 L 30 36 L 10 36 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 38 20 Q 38 8 48 8 Q 58 8 58 20 L 58 36 L 38 36 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 66 20 Q 66 8 76 8 Q 86 8 86 20 L 86 36 L 66 36 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <!-- Windows row 2 -->
    <path d="M 10 60 Q 10 48 20 48 Q 30 48 30 60 L 30 76 L 10 76 Z" fill="#6B9BB8" opacity="0.4" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 38 60 Q 38 48 48 48 Q 58 48 58 60 L 58 76 L 38 76 Z" fill="#6B9BB8" opacity="0.4" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 66 60 Q 66 48 76 48 Q 86 48 86 60 L 86 76 L 66 76 Z" fill="#6B9BB8" opacity="0.4" stroke="#3D2B1F" stroke-width="0.8"/>
    <!-- Windows row 3 -->
    <path d="M 10 100 Q 10 88 20 88 Q 30 88 30 100 L 30 116 L 10 116 Z" fill="#6B9BB8" opacity="0.35" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 38 100 Q 38 88 48 88 Q 58 88 58 100 L 58 116 L 38 116 Z" fill="#6B9BB8" opacity="0.35" stroke="#3D2B1F" stroke-width="0.8"/>
    <!-- Gabled roofline -->
    <polygon points="0,0 45,-22 90,0" fill="#6B3520"/>
    <polygon points="0,0 45,-22 90,0" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>

    <!-- Warehouse 2 -->
    <rect x="96"  y="18" width="82" height="162" fill="#8B3A22"/>
    <rect x="96"  y="18" width="82" height="162" fill="url(#brickwork)"/>
    <rect x="96"  y="18" width="82" height="162" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    <path d="M 104 36 Q 104 24 114 24 Q 124 24 124 36 L 124 52 L 104 52 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 132 36 Q 132 24 142 24 Q 152 24 152 36 L 152 52 L 132 52 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 160 36 Q 160 24 170 24 Q 180 24 180 36 L 180 52 L 160 52 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 104 76 Q 104 64 114 64 Q 124 64 124 76 L 124 92 L 104 92 Z" fill="#6B9BB8" opacity="0.4" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 160 76 Q 160 64 170 64 Q 180 64 180 76 L 180 92 L 160 92 Z" fill="#6B9BB8" opacity="0.4" stroke="#3D2B1F" stroke-width="0.8"/>
    <polygon points="96,18 137,−8 178,18" fill="#6B3520"/>
    <polygon points="96,18 137,−8 178,18" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>

    <!-- Warehouse 3 (smaller) -->
    <rect x="184" y="28" width="70" height="152" fill="#8B3A22"/>
    <rect x="184" y="28" width="70" height="152" fill="url(#brickwork)"/>
    <rect x="184" y="28" width="70" height="152" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    <path d="M 192 46 Q 192 34 202 34 Q 212 34 212 46 L 212 62 L 192 62 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 220 46 Q 220 34 230 34 Q 240 34 240 46 L 240 62 L 220 62 Z" fill="#6B9BB8" opacity="0.5" stroke="#3D2B1F" stroke-width="0.8"/>
    <path d="M 192 86 Q 192 74 202 74 Q 212 74 212 86 L 212 102 L 192 102 Z" fill="#6B9BB8" opacity="0.4" stroke="#3D2B1F" stroke-width="0.8"/>
    <polygon points="184,28 219,6 254,28" fill="#6B3520"/>
    <polygon points="184,28 219,6 254,28" fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
  </g>

  <!-- ── Port Cranes ─────────────────────────────────────────────────────── -->
  <g id="cranes" stroke="#3D2B1F" stroke-width="2.5" fill="none" opacity="0.75">
    <!-- Crane 1 -->
    <g transform="translate(600, 200)">
      <!-- Mast -->
      <line x1="20" y1="280" x2="20" y2="0"/>
      <!-- Jib (horizontal arm) -->
      <line x1="-60" y1="20" x2="100" y2="20"/>
      <!-- Counter-jib weight -->
      <rect x="-64" y="14" width="20" height="14" fill="#A89880" stroke="#3D2B1F" stroke-width="1.5"/>
      <!-- Cable from jib tip to hook -->
      <line x1="90" y1="20" x2="80" y2="160"/>
      <!-- Hook -->
      <path d="M 76 158 Q 76 168 84 168 Q 90 168 90 160" stroke-width="2"/>
      <!-- Cabin -->
      <rect x="10" y="22" width="20" height="22" fill="#A89880" stroke="#3D2B1F" stroke-width="1.5"/>
      <!-- Base / rail -->
      <line x1="0" y1="280" x2="40" y2="280"/>
      <circle cx="6"  cy="284" r="5" fill="#8B6F47" stroke="#3D2B1F" stroke-width="1.5"/>
      <circle cx="34" cy="284" r="5" fill="#8B6F47" stroke="#3D2B1F" stroke-width="1.5"/>
      <!-- Diagonal support cables -->
      <line x1="20" y1="0" x2="-60" y2="20" stroke-width="1.5"/>
      <line x1="20" y1="0" x2="100" y2="20" stroke-width="1.5"/>
    </g>
    <!-- Crane 2 (further back, thinner) -->
    <g transform="translate(780, 240)" opacity="0.55">
      <line x1="14" y1="240" x2="14" y2="10"/>
      <line x1="-40" y1="26" x2="70" y2="26"/>
      <rect x="-44" y="20" width="14" height="10" fill="#A89880" stroke="#3D2B1F" stroke-width="1"/>
      <line x1="62" y1="26" x2="56" y2="120"/>
      <rect x="8" y="28" width="14" height="16" fill="#A89880" stroke="#3D2B1F" stroke-width="1"/>
      <line x1="14" y1="10" x2="-40" y2="26" stroke-width="1.2"/>
      <line x1="14" y1="10" x2="70"  y2="26" stroke-width="1.2"/>
    </g>
    <!-- Crane 3 (background, faint) -->
    <g transform="translate(920, 260)" opacity="0.35">
      <line x1="10" y1="220" x2="10" y2="20"/>
      <line x1="-30" y1="34" x2="55" y2="34"/>
      <line x1="10" y1="20" x2="-30" y2="34" stroke-width="1"/>
      <line x1="10" y1="20" x2="55"  y2="34" stroke-width="1"/>
    </g>
  </g>

  <!-- ── Ships / Barges on the River ────────────────────────────────────── -->
  <!-- Cargo barge 1 -->
  <g id="barge-1" transform="translate(320, 510)">
    <path d="M 0 36 Q 8 28 200 28 Q 220 28 220 36 L 210 54 Q 140 60 80 56 Q 10 58 0 36 Z"
          fill="#A89880"/>
    <path d="M 0 36 Q 8 28 200 28 Q 220 28 220 36 L 210 54 Q 140 60 80 56 Q 10 58 0 36 Z"
          fill="none" stroke="#3D2B1F" stroke-width="1.5"/>
    <!-- Cargo containers -->
    <rect x="20" y="8" width="52" height="20" fill="#7A9E7E" stroke="#3D2B1F" stroke-width="1"/>
    <rect x="78" y="8" width="52" height="20" fill="#C4714F" stroke="#3D2B1F" stroke-width="1"/>
    <rect x="136" y="8" width="52" height="20" fill="#8B6F47" stroke="#3D2B1F" stroke-width="1"/>
    <!-- Bow -->
    <path d="M 0 36 Q -10 36 -12 42 Q -10 48 0 48" fill="#8B6F47"/>
    <!-- Wheelhouse -->
    <rect x="166" y="-2" width="30" height="20" fill="#D4B88A" stroke="#3D2B1F" stroke-width="1"/>
    <rect x="170" y="2"  width="8"  height="8"  fill="#6B9BB8" opacity="0.5"/>
    <rect x="184" y="2"  width="8"  height="8"  fill="#6B9BB8" opacity="0.5"/>
  </g>

  <!-- Small tugboat -->
  <g id="tug-1" transform="translate(140, 548)">
    <path d="M 0 20 Q 6 14 80 14 Q 90 14 88 20 L 82 32 Q 50 36 20 32 Z" fill="#8B6F47"/>
    <path d="M 0 20 Q 6 14 80 14 Q 90 14 88 20 L 82 32 Q 50 36 20 32 Z" fill="none" stroke="#3D2B1F" stroke-width="1"/>
    <rect x="54" y="4" width="20" height="14" fill="#D4B88A" stroke="#3D2B1F" stroke-width="0.8"/>
    <line x1="64" y1="0" x2="64" y2="-18" stroke="#3D2B1F" stroke-width="1.5"/>
    <!-- Smoke puff -->
    <circle cx="66" cy="-22" r="6" fill="#D4B88A" opacity="0.5"/>
    <circle cx="72" cy="-28" r="5" fill="#D4B88A" opacity="0.4"/>
    <circle cx="78" cy="-24" r="4" fill="#D4B88A" opacity="0.3"/>
  </g>

  <!-- ── Riverbank (south bank, below river) ───────────────────────────── -->
  <rect x="0" y="640" width="1080" height="440" fill="#C8B888" opacity="0.55"/>
  <!-- Cobblestone quay texture suggestion -->
  <g stroke="#8B6F47" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="660" x2="1080" y2="660"/>
    <line x1="0" y1="680" x2="1080" y2="680"/>
    <line x1="0" y1="700" x2="1080" y2="700"/>
  </g>

  <!-- ── City Label ─────────────────────────────────────────────────────── -->
  <text x="540" y="760" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="26" font-variant="small-caps" letter-spacing="5"
        fill="#3D2B1F" opacity="0.72">Hamburg</text>
  <line x1="452" y1="768" x2="628" y2="768" stroke="#8B6F47" stroke-width="1" opacity="0.55"/>
</svg>

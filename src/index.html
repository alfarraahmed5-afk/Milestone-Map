<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2C1F14" />
  <title>Journey Map — Copenhagen to Lisbon</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="map-container" role="main" aria-label="Journey map scroll area">
    <!-- SVG map is injected here by map.js -->
  </div>

  <script type="module">
    import { initMap } from './js/map.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('map-container');
      await initMap(container);

      // Scroll to bottom (Copenhagen start) on load
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
      });
    });
  </script>
</body>
</html>
